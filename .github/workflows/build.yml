name: Build Nyavogo Cica APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip NyavogoCica-GitHub-BuildCsomag.zip

      - name: Build APK
        run: gradle -p NyavogoCica-Android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NyavogoCica-APK
          path: NyavogoCica-Android/app/build/outputs/apk/debug/app-debug.apk
